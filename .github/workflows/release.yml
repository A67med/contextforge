name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Test
        run: cargo test --workspace --locked
      - name: Build release CLI sidecar
        shell: pwsh
        run: |
          cargo build -p contextforge-cli --release --locked
          New-Item -ItemType Directory -Force apps/desktop/src-tauri/binaries | Out-Null
          Copy-Item target/release/contextforge.exe apps/desktop/src-tauri/binaries/contextforge-x86_64-pc-windows-msvc.exe
      - name: Build installer
        working-directory: apps/desktop
        run: |
          npm ci
          npx tauri build
      - name: Checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem target/release/bundle/nsis/*.exe
          $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content target/release/bundle/nsis/SHA256SUMS.txt
      - name: Upload to draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view $env:GITHUB_REF_NAME 2>$null; if ($LASTEXITCODE -ne 0) { gh release create $env:GITHUB_REF_NAME --draft --title "ContextForge $env:GITHUB_REF_NAME" --notes "See CHANGELOG.md" }
          gh release upload $env:GITHUB_REF_NAME (Get-ChildItem target/release/bundle/nsis/*.exe).FullName target/release/bundle/nsis/SHA256SUMS.txt --clobber
      - uses: actions/upload-artifact@v5
        with:
          name: contextforge-windows-installer
          path: target/release/bundle/nsis/
